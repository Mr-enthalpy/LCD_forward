[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcd-forward"
version = "0.1.0"
description = "LCD mask-to-operator modelling package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lcd_forward*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
