model = "gpt-5-codex"

[project]
root = "."
default_branch = "master"

[environment]
setup = "pip install -e ."
python = "3.14"

[commands]
test = "pytest -q"

[policies]
network_access = false
allow_shell = true

[guidance]
summary = """
Work within the LCD mask-to-operator modelling route only.
Treat current source directories as placeholders unless implementation is explicitly scoped.
Do not restore dense PSF, training, reconstruction, or HDF5 prototype code by default.
Do not add hardware-facing code.
Keep the minimal package import test runnable.
"""
