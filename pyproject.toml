[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mono-lcd-spectral-prototype"
version = "0.1.0"
description = "Prototype for mono LCD programmable diffractive spectral imaging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "h5py",
    "matplotlib",
    "pyyaml",
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]