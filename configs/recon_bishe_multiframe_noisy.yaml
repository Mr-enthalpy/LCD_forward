experiment_id: bishe_first_pass_phase3_5_3_6_noisy
run_id: auto_timestamp

release:
  root: ${LCD_RELEASE_ROOT:D:/datasets/optic_system/phase3_release_20260520}

data:
  train_h5: ${LCD_TRAIN_H5}
  val_h5: ${LCD_VAL_H5}
  test_h5: ${LCD_TEST_H5}

cave:
  enabled: true
  root: ${CAVE_ROOT:D:/datasets/CAVE}
  processed_dir: ${CAVE_PROCESSED}
  test_h5: ${CAVE_TEST_H5}

forward_validation:
  method: psf_pca_ridge
  mask_normalization: code_to_unit_interval
  psf_working_size: [256, 256]
  pca_components: 24
  ridge_alpha: 1.0
  train_per_wavelength: true
  metrics:
    - mse
    - relative_l2
    - normalized_correlation
  num_examples_to_plot: 6

linear_recon:
  mode: synthetic
  synthetic_object_size: [256, 256]
  cave_object_size: [256, 256]
  wavelengths_nm: [450.0, 550.0, 650.0]
  selected_masks:
    strategy: diverse_family_first
    count: 12
  psf_source: measured_dictionary
  psf_working_size: [256, 256]
  solver: frequency_domain_ridge
  ridge_alpha: 1.0e-12
  ridge_policy: adaptive
  compare_single_frame: true
  add_noise:
    enabled: true
    type: closed_lcd_avg10_residual
    source_h5: ${LCD_CLOSED_LCD_RESIDUAL_H5:D:/datasets/optic_system/optic_system_phase3_closed_lcd_residual_release_20260523/closed_lcd_roi512_avg10_residuals.h5}
    source_mask_id: all_closed_window
    n_avg_frames: 10
    is_sensor_dark: false
    is_single_frame_burst: false
    count_peak: 200.0
    scale_quantile: 0.999
    sample_policy: pooled
    resize_mode: center_crop
    seed: 20260520
    claim_level: averaged_frame_closed_lcd_residual
  synthetic_fixed_seed: 42
  num_cave_eval_scenes: 3

output:
  root: outputs/bishe_first_pass_noisy
